[build-system]
requires = ["hatchling>=1.0.0"]
build-backend = "hatchling.build"

[project]
name = "multi-robot-multi-goal-path-planning"
version = "0.1.0"
description = "A benchmarking framework for multi-robot path planning"
readme = "readme.md"
requires-python = ">=3.10"
dependencies = [
    "scipy",
    "networkx",
    "numba",
    "sortedcontainers",
    "numpy",
    "matplotlib>=3.4.0",
    "simple-parsing",
    "robotic>=0.2.2,<0.3.0",
]

[project.optional-dependencies]
pinocchio = ["pin>=3.4", "meshcat", "hppfcl"]
mujoco = ["mujoco", "mujoco-mjx"]
viser = ["viser"]
test = ["pytest"]
all = ["pin>=3.4", "meshcat", "hppfcl", "mujoco", "mujoco-mjx", "viser"]

[tool.hatch.build.targets.wheel]
packages = ["src/multi_robot_multi_goal_planning"]

[tool.hatch.build]
only-packages = true